{% set version = "1.3.3" %}

package:
  name: phagemine
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/phagemine/phagemine-{{ version }}.tar.gz
  sha256: 52e3c35ba4cc8d53021add3cd181becc3913274f56381fabfdffc49e358d79e6

build:
  number: 0
  noarch: python
  run_exports:
    - {{ pin_subpackage('phagemine', max_pin="x") }}
  entry_points:
    - phagemine = phagemine.cli:main
    - phagemine-gui = phagemine.gui.launcher:main

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=68,<81
    - wheel
  run:
    - python >=3.10
    - setuptools <81
    - biopython >=1.85,<2
    - psutil >=5,<8
    - streamlit >=1.49,<2
    - matplotlib-base >=3.7,<4
    - pyhmmer >=0.10,<0.13
    - pyrodigal =3.7.1
    - pyrodigal-gv =0.3.2
    - pyrodigal-rv =0.1.0
    - phanotate =1.6.7
    - prodigal =2.6.3
    - hmmer =3.4
    - mmseqs2
    - diamond
    - mash =2.3
    - blast
    - trnascan-se =2.0.12

test:
  imports:
    - phagemine
    - phagemine.rna_features
    - phagemine.curation
    - phagemine.annotation_reliability
    - pyrodigal_gv
    - pyrodigal_rv
  commands:
    - phagemine-gui --help
    - phagemine --version
    - phagemine run --help
    - phagemine rna --help
    - phagemine curate --help

about:
  home: https://github.com/emmannaemeka/PhageMine
  license: MIT
  license_file: LICENSE
  summary: Evidence-first phage annotation with RNA coverage and audited curation

extra:
  recipe-maintainers:
    - emmannaemeka

